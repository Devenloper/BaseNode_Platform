name: Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  architecture-boundary-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Architecture gate
        run: python scripts/architecture-gate.py