name: Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  architecture-boundary-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Boundary import check
        run: python scripts/check_architecture_imports.py $(git ls-files '*.py')

      - name: Repository structure check
        run: python scripts/check_repository_structure.py